name: secure-ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: secure-ci-cd-lab:${{ github.sha }}

jobs:
  test:
    name: Test and Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Run lint checks
        run: ruff check app tests

      - name: Execute tests with coverage gate
        run: pytest --junitxml=reports/junit.xml

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage
          path: |
            coverage.xml
            reports/junit.xml
          if-no-files-found: warn

  sast:
    name: SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Run Bandit
        run: bandit -r app -lll -ii -f json -o reports/bandit.json

      - name: Run Semgrep
        run: semgrep scan --config .semgrep.yml --error --json --output reports/semgrep.json app tests

      - name: Upload SAST artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: reports/
          if-no-files-found: warn

  dependencies:
    name: Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Verify package metadata consistency
        run: python -m pip check

      - name: Run pip-audit
        run: pip-audit --strict --desc --format json --output reports/pip-audit.json

      - name: Upload dependency scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan
          path: reports/
          if-no-files-found: warn

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Run Gitleaks via Docker
        run: |
          docker run --rm -v "${PWD}:/repo" ghcr.io/gitleaks/gitleaks:latest git \
            --source /repo \
            --redact \
            --report-format sarif \
            --report-path /repo/reports/gitleaks.sarif \
            --exit-code 1

      - name: Upload secret scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan
          path: reports/
          if-no-files-found: warn

  container-security:
    name: Container Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Prepare reports directory
        run: mkdir -p reports

      - name: Build container image
        run: docker build --tag "${IMAGE_NAME}" .

      - name: Produce Trivy report artifact
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: json
          output: reports/trivy-image.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library

      - name: Enforce Trivy gate
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"
          skip-setup-trivy: true

      - name: Upload container scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-scan
          path: reports/
          if-no-files-found: warn

  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - test
      - sast
      - dependencies
      - secrets
      - container-security

    steps:
      - name: Publish summary
        run: |
          {
            echo "## Pipeline controls at a glance"
            echo ""
            echo "| Control | Result | Blocking policy |"
            echo "| --- | --- | --- |"
            echo "| Tests and coverage | ${{ needs.test.result }} | Test failures, Ruff findings, or coverage below 85% block the run |"
            echo "| SAST | ${{ needs.sast.result }} | Bandit high-severity findings or curated Semgrep rule hits block the run |"
            echo "| Dependency scan | ${{ needs.dependencies.result }} | Known vulnerable packages block the run |"
            echo "| Secret scan | ${{ needs.secrets.result }} | Any detected secret blocks the run |"
            echo "| Container security | ${{ needs.container-security.result }} | Trivy HIGH/CRITICAL findings with fixes available block the run |"
          } >> "$GITHUB_STEP_SUMMARY"
